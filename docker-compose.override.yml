services:
  rawgitlab:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - GitLab__BaseUrl=https://git.example.com
      - GitLab__PrivateToken=glpat-YOUR_TOKEN_HERE
    ports:
      - "8006:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s